<app-sidebar></app-sidebar>
<div class="content">
  <div class="main-tab">
    <div class="col-lg-12">
      <ul class="nav nav-tabs">
        <li class="nav-item">
          <a routerLink="/rentmanage/homerentmanage/addtenent" routerLinkActive="active" class="nav-link active color1">Add Tenant</a>
        </li>   
        <li class="nav-item">
          <a routerLink="/rentmanage/homerentmanage/viewtenent" routerLinkActive="active" class="nav-link color1">View Tenant</a>
        </li>   
        <li class="nav-item">
          <a routerLink="/rentmanage/homerentmanage/managetenent" routerLinkActive="active" class="nav-link color1">Manage Tenant</a>
        </li>   
      </ul>
    </div>
  </div>
  <div class="row col-lg-10 mt-1">
    <div class="col-lg-4 col-xxl-4">
      <div class="mb-xl-3">
          <label class="form-label">Name<span class="text-danger">*</span></label>
          <input class="form-control" type="text" placeholder="Enter Full Name" autocomplete="off" id="fullname" maxlength="40">
      </div>
    </div>
    <div class="col-lg-4 col-xxl-4">
      <div class="mb-xl-3">
          <label class="form-label">Age<span class="text-danger">*</span></label>
          <input class="form-control" type="text" placeholder="Enter Age" autocomplete="off" id="age" maxlength="3"
          onkeyup="this.value=this.value.replace(/[^0-9. ]/g,'');" >
      </div>
    </div>
    <div class="col-lg-4 col-xxl-4">
      <div class="mb-xl-3">
          <label class="form-label">Mobile No<span class="text-danger">*</span></label>
          <input class="form-control" type="text" placeholder="Enter Mobile No" autocomplete="off" id="mobile" maxlength="12"
          onkeyup="this.value=this.value.replace(/[^0-9. ]/g,'');" >
      </div>
    </div>
    <div class="col-lg-4 col-xxl-4">
      <div class="mb-xl-3">
          <label class="form-label">Alternate Mobile No<span class="text-danger"></span></label>
          <input class="form-control" type="text" placeholder="Enter Alternate Mobile No" autocomplete="off" id="alternate" maxlength="12"
          onkeyup="this.value=this.value.replace(/[^0-9. ]/g,'');" >
      </div>
    </div>
    <div class="col-lg-4 col-xxl-4">
      <div class="mb-xl-3">
          <label class="form-label">No Of Member<span class="text-danger">*</span></label>
          <input class="form-control" type="text" placeholder="Enter No Of Member" autocomplete="off" id="member" maxlength="2"
          onkeyup="this.value=this.value.replace(/[^0-9. ]/g,'');" >
      </div>
    </div>
    <div class="col-lg-4 col-xxl-4">
      <div class="mb-xl-3">
          <label class="form-label">Member Mobile No<span class="text-danger"></span></label>
          <input class="form-control" type="text" placeholder="Member Mobile No" autocomplete="off" id="othmobile" maxlength="12"
          onkeyup="this.value=this.value.replace(/[^0-9. ]/g,'');" >
      </div>
    </div>
    <div class="col-lg-4 col-xxl-4">
      <div class="mb-xl-3">
          <label class="form-label">Select House<span class="text-danger">*</span></label>
          <select class="form-select" name="house" id="house" (change)="onChangeHouse($event)">
              <option value="" selected disabled>Select House</option>
              <ng-container *ngFor="let item of houselist">
                  <option value={{item.homeId}}>{{item.homeName}}</option>
              </ng-container>
          </select>
      </div>
    </div>
    <div class="col-lg-4 col-xxl-4">
      <div class="mb-xl-3">
          <label class="form-label">Select Room<span class="text-danger">*</span></label>
          <select class="form-select" name="room" id="room">
            <option value="" selected disabled>Select Room</option>
            <ng-container *ngFor="let item of roomlist">
                <option value={{item.roomId}}>{{item.roomNo}}</option>
            </ng-container>
        </select>
      </div>
    </div>
    <div class="col-lg-4 col-xxl-4">
      <div class="mb-xl-3">
          <label class="form-label">Rent Amount<span class="text-danger">*</span></label>
          <input class="form-control" type="text" placeholder="Enter Rent Amount" autocomplete="off" id="rent" maxlength="7"
          onkeyup="this.value=this.value.replace(/[^0-9. ]/g,'');" >
      </div>
    </div>
    <div class="col-lg-4 col-xxl-4">
      <div class="mb-xl-3">
          <label class="form-label">Advance Amount<span class="text-danger">*</span></label>
          <input class="form-control" type="text" placeholder="Enter Advance Amount" autocomplete="off" id="adv" maxlength="7"
          onkeyup="this.value=this.value.replace(/[^0-9. ]/g,'');" >
      </div>
    </div>
    <div class="col-lg-4 col-xxl-4">
      <div class="mb-xl-3">
          <label class="form-label">Effective Date<span class="text-danger">*</span></label>
          <input type="text" class="form-control datepicker" autocomplete="off" placeholder="DD/MM/YYYY" id="date" name="date">
      </div>
    </div>
    <div class="col-lg-4 col-xxl-4">
      <div class="mb-xl-3">
          <label class="form-label">Aadhar Details<span class="text-danger">*</span></label>
          <input type="file" class="form-control" id="image1" accept=".pdf,.jpg,.jpeg"  (change)="handleFileInput($event,1)" required>
      </div>
    </div>
    <div class="col-lg-4 col-xxl-4">
      <div class="mb-xl-3">
          <label class="form-label">Rent Aggrement<span class="text-danger"></span></label>
          <input type="file" class="form-control" id="image2" accept=".pdf,.jpg,.jpeg"  (change)="handleFileInput($event,2)" required>
      </div>
    </div>
    <div class="col-lg-4 col-xxl-4">
      <div class="mb-xl-3">
          <label class="form-label">Other Documents<span class="text-danger"></span></label>
          <input type="file" class="form-control" id="image3" accept=".pdf,.jpg,.jpeg"  (change)="handleFileInput($event,3)" required>
      </div>
    </div>
    <div class="col-lg-4 col-xxl-4" style="margin-top: 30px;">
      <input type="button" value="Save" class="btn btn-primary me-2" style="width: 48%;" (click)="submit()">
      <input type="button" value="Reset" class="btn btn-info" style="width: 48%;" (click)="resetVal()">
    </div>
  </div>
</div>
